<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaizeCare AI — Intelligent Maize Disease Detection & Farmer Advisory</title>
    <meta name="description" content="Intelligent maize disease detection and agricultural advisory platform for Ethiopian smallholder farmers, extension agents, and administrators." />
    <meta property="og:title" content="MaizeCare AI — Intelligent Maize Disease Detection & Farmer Advisory" />
    <meta property="og:description" content="Intelligent maize disease detection and agricultural advisory platform for Ethiopian smallholder farmers, extension agents, and administrators." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('maizecare_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-stone-900 dark:bg-[#0C1310] dark:text-stone-100 antialiased selection:bg-emerald-800 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
